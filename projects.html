<!doctype html>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
/>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: rgb(0, 20, 60);
    color: #dbe9ff;
    font-family: "VT323", "Courier New", monospace;
    font-size: 22px;
    padding: 8vh 6vw 100px;
  }

  .osd {
    max-width: 640px;
    margin: 0 auto 60px auto;
    border: 2px solid rgba(219, 233, 255, 0.5);
    padding: 30px 40px 34px;
    background: rgba(0, 0, 0, 0.15);
  }

  .osd-title {
    text-align: center;
    font-size: 34px;
    letter-spacing: 4px;
    margin: 0 0 34px 0;
    white-space: nowrap;
  }

  .osd-menu {
    list-style-type: none;
    padding: 0;
    margin: 0 0 30px 0;
  }

  .osd-menu li {
    margin: 2px 0;
  }

  .osd-menu button {
    font-family: inherit;
    background: transparent;
    border: none;
    color: #dbe9ff;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 3px 14px;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }

  .osd-menu button.active {
    background: #dbe9ff;
    color: rgb(0, 20, 60);
  }

  .osd-menu button:hover:not(.active) {
    color: #ffffff;
  }

  .osd-footer {
    border-top: 1px solid rgba(219, 233, 255, 0.35);
    padding-top: 16px;
    font-size: 20px;
    color: rgba(219, 233, 255, 0.7);
    line-height: 1.7;
  }

  .osd-footer .key {
    display: inline-block;
    width: 90px;
    color: #dbe9ff;
  }

  .osd-footer a {
    color: #dbe9ff;
  }

  a {
    color: #dbe9ff;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 32px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .project-card {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(219, 233, 255, 0.4);
  }

  .project-media {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2px;
  }

  .project-media.single {
    grid-template-columns: 1fr;
  }

  .project-media img,
  .project-media video {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    background: #000;
  }

  .project-card .info {
    padding: 14px 16px 18px;
  }

  .project-card .info h2 {
    margin: 0 0 6px 0;
    font-size: 22px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .project-card .info p {
    margin: 0 0 10px 0;
    font-size: 18px;
    line-height: 1.4;
    color: rgba(219, 233, 255, 0.75);
  }

  .project-card-link {
    display: block;
    color: inherit;
    text-decoration: none;
  }

  .project-card-link:hover {
    text-decoration: none;
  }

  .project-card-link:hover .info h2 {
    text-decoration: underline;
  }

  .info-extra {
    padding: 0 16px 16px;
  }

  .info-extra a {
    font-size: 16px;
  }

  .empty-state {
    text-align: center;
    font-size: 20px;
    color: rgba(219, 233, 255, 0.55);
    padding: 60px 20px;
  }
</style>

<html lang="en">
  <head>
    <title>MART</title>
  </head>
  <body>
    <div class="osd">
      <h1 class="osd-title">- - - - PROJECTS - - - -</h1>

      <ul id="category-tabs" class="osd-menu"></ul>

      <p class="osd-footer">
        <span class="key">SELECT</span> : CLICK CATEGORY<br />
        <span class="key">VIEW</span> : SCROLL DOWN<br />
        <span class="key">BACK</span> : <a href="portfolio.html">PORTFOLIO</a>
      </p>
    </div>

    <div id="project-grid" class="project-grid"></div>

    <script src="assets/js/site-data.js"></script>
    <script>
      const CATEGORIES = [
        "Short Films",
        "Feature Films",
        "Street Photography",
        "About",
      ];

      (async function renderProjects() {
        const tabsRoot = document.getElementById("category-tabs");
        const gridRoot = document.getElementById("project-grid");
        let activeCategory = "All";
        let allProjects = [];

        function renderTabs() {
          const categories = ["All", ...CATEGORIES];
          tabsRoot.innerHTML = categories
            .map(
              (cat) => `
              <li>
                <button data-category="${escapeHtml(cat)}" class="${cat === activeCategory ? "active" : ""}">
                  ${escapeHtml(cat)}
                </button>
              </li>
            `,
            )
            .join("");

          tabsRoot.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => {
              activeCategory = btn.dataset.category;
              renderTabs();
              renderGrid();
            });
          });
        }

        function mediaHtml(item) {
          const media =
            item.media && item.media.length
              ? item.media
              : item.imageUrl
                ? [{ url: item.imageUrl, type: "image" }]
                : [];
          if (!media.length) return "";

          const tiles = media
            .map((m) =>
              m.type === "video"
                ? `<video src="${escapeHtml(m.url)}" controls muted playsinline></video>`
                : `<img src="${escapeHtml(m.url)}" alt="" />`,
            )
            .join("");

          return `<div class="project-media ${media.length === 1 ? "single" : ""}">${tiles}</div>`;
        }

        function renderGrid() {
          const items =
            activeCategory === "All"
              ? allProjects
              : allProjects.filter((p) => p.category === activeCategory);

          if (!items.length) {
            gridRoot.innerHTML =
              '<p class="empty-state">No projects here yet — add some from the admin portal.</p>';
            return;
          }

          gridRoot.innerHTML = items
            .map(
              (item) => `
              <div class="project-card">
                <a class="project-card-link" href="${item.slug ? `/projects/${escapeHtml(item.slug)}` : "#"}">
                  ${mediaHtml(item)}
                  <div class="info">
                    ${item.title ? `<h2>${escapeHtml(item.title)}</h2>` : ""}
                    ${item.description ? `<p>${escapeHtml(item.description)}</p>` : ""}
                  </div>
                </a>
                ${item.link ? `<div class="info-extra"><a href="${escapeHtml(item.link)}" target="_blank" rel="noopener">External link &rarr;</a></div>` : ""}
              </div>
            `,
            )
            .join("");
        }

        try {
          allProjects = await fetchCollection("projects");
        } catch (err) {
          console.error(err);
        }

        renderTabs();
        renderGrid();
      })();
    </script>
  </body>
</html>
