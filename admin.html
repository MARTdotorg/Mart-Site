<!doctype html>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: rgb(0, 48, 125);
    color: #eee;
    font-family: "Helvetica Neue", Arial, sans-serif;
    padding: 6vh 6vw 100px;
  }

  h1 {
    text-align: center;
    color: #ffcf1f;
    letter-spacing: 4px;
    font-style: italic;
    font-weight: 800;
    margin: 0 0 8px 0;
  }

  .subtitle {
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    letter-spacing: 1px;
    margin: 0 0 30px 0;
  }

  .top-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    align-items: center;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
  }

  .btn {
    background: transparent;
    border: 2px solid #ffcf1f;
    color: #ffcf1f;
    padding: 8px 16px;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
  }

  .btn:hover {
    background: #ffcf1f;
    color: rgb(0, 48, 125);
  }

  .btn.danger {
    border-color: #ff5b5b;
    color: #ff5b5b;
  }

  .btn.danger:hover {
    background: #ff5b5b;
    color: #1a1a1a;
  }

  .btn:disabled,
  select:disabled,
  input:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .btn:disabled:hover {
    background: transparent;
    color: #ffcf1f;
  }

  #status-banner {
    text-align: center;
    font-size: 13px;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 30px;
  }

  #local-dev-box {
    max-width: 420px;
    margin: 0 auto 40px auto;
    padding: 16px 20px;
    border: 1px dashed rgba(255, 255, 255, 0.35);
    text-align: center;
    display: none;
  }

  #local-dev-box input {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #eee;
    padding: 8px 10px;
    width: 220px;
    margin-right: 8px;
  }

  .collection-section {
    max-width: 900px;
    margin: 0 auto 70px auto;
    display: none;
  }

  .collection-section.active {
    display: block;
  }

  .collection-section h2 {
    color: #ffcf1f;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 20px;
    border-bottom: 2px solid rgba(255, 207, 31, 0.3);
    padding-bottom: 10px;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .tabs button.active {
    background: #ffcf1f;
    color: rgb(0, 48, 125);
  }

  form.item-form {
    background: rgba(0, 0, 0, 0.35);
    padding: 20px;
    margin-bottom: 30px;
    display: grid;
    gap: 12px;
  }

  form.item-form label {
    display: flex;
    flex-direction: column;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: rgba(255, 255, 255, 0.75);
    gap: 4px;
  }

  form.item-form input[type="text"],
  form.item-form input[type="number"],
  form.item-form select,
  form.item-form textarea {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    padding: 8px 10px;
    font-size: 14px;
  }

  form.item-form textarea {
    min-height: 70px;
    resize: vertical;
  }

  form.item-form .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  .item-list {
    display: grid;
    gap: 12px;
  }

  .media-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .media-thumb {
    position: relative;
    width: 96px;
    height: 64px;
    flex: none;
  }

  .media-thumb img,
  .media-thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }

  .media-thumb .remove-media {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ff5b5b;
    color: #1a1a1a;
    border: none;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0, 0, 0, 0.3);
    padding: 10px 14px;
  }

  .item-row img {
    width: 70px;
    height: 47px;
    object-fit: cover;
    background: #222;
    flex: none;
  }

  .item-row .meta {
    flex: 1;
    min-width: 0;
  }

  .item-row .meta strong {
    display: block;
    color: #ffcf1f;
    font-size: 14px;
  }

  .item-row .meta span {
    display: block;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-row .row-actions {
    display: flex;
    gap: 8px;
    flex: none;
  }

  .empty-note {
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    padding: 10px 0;
  }

  #locked-notice {
    max-width: 500px;
    margin: 0 auto;
    text-align: center;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.6;
  }

  /* ---------- LAYOUT BUILDER (freeform per-project canvas) ---------- */
  .layout-builder-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #14161c;
    flex-direction: column;
  }

  .lb-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: #1d2029;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .lb-toolbar select,
  .lb-toolbar input[type="number"] {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    padding: 6px 8px;
    font-size: 13px;
  }

  .lb-toolbar input[type="color"] {
    width: 36px;
    height: 30px;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: none;
  }

  .lb-sep {
    width: 1px;
    height: 24px;
    background: rgba(255, 255, 255, 0.15);
  }

  .lb-canvas-wrap {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .lb-canvas {
    position: relative;
    background: #ffffff;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    flex: none;
  }

  .lb-element {
    position: absolute;
    cursor: move;
    outline: 1px dashed rgba(0, 0, 0, 0.15);
  }

  .lb-element.selected {
    outline: 2px solid #2e7dff;
  }

  .lb-element img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .lb-text-content {
    width: 100%;
    height: 100%;
    outline: none;
    overflow: hidden;
    cursor: text;
  }

  .lb-resize-handle {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 14px;
    height: 14px;
    background: #2e7dff;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: nwse-resize;
  }
</style>

<html lang="en">
  <head>
    <title>MART · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=VT323&display=swap"
      rel="stylesheet"
    />
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <h1>MART Admin</h1>
    <p class="subtitle">Manage homepage frames, portfolio &amp; projects</p>

    <div class="top-bar">
      <button id="login-btn" class="btn">Log in</button>
      <button id="logout-btn" class="btn danger" style="display: none">
        Log out
      </button>
      <span
        id="user-email"
        style="font-size: 13px; color: rgba(255, 255, 255, 0.7)"
      ></span>
    </div>

    <div id="status-banner"></div>

    <div id="local-dev-box">
      Local dev mode: paste your <code>DEV_ADMIN_TOKEN</code> (only needed if
      you set one in <code>.env</code>).
      <div style="margin-top: 10px">
        <input id="dev-token-input" type="text" placeholder="dev admin token" />
        <button id="dev-token-save" class="btn">Save</button>
      </div>
    </div>

    <div id="locked-notice" style="display: none">
      <p>
        Log in above to manage content. On the live site this uses Netlify
        Identity.
      </p>
    </div>

    <div id="admin-app" style="display: none">
      <ul class="tabs" id="main-tabs"></ul>
      <div id="sections-root"></div>
    </div>

    <div id="layout-builder" class="layout-builder-overlay">
      <div class="lb-toolbar">
        <button id="lb-add-text" type="button" class="btn">+ Text</button>
        <button id="lb-add-image" type="button" class="btn">+ Image</button>
        <span class="lb-sep"></span>
        <select id="lb-font-family" title="Font family"></select>
        <input
          id="lb-font-size"
          type="number"
          min="8"
          max="220"
          style="width: 64px"
          title="Font size"
        />
        <input id="lb-font-color" type="color" title="Text color" />
        <select id="lb-font-weight" title="Weight">
          <option value="400">Regular</option>
          <option value="700">Bold</option>
        </select>
        <select id="lb-text-align" title="Alignment">
          <option value="left">Left</option>
          <option value="center">Center</option>
          <option value="right">Right</option>
        </select>
        <span class="lb-sep"></span>
        <button id="lb-delete" type="button" class="btn danger">Delete</button>
        <span style="flex: 1"></span>
        <button id="lb-save" type="button" class="btn">Save Layout</button>
        <button id="lb-close" type="button" class="btn">Close</button>
      </div>
      <div class="lb-canvas-wrap">
        <div id="lb-canvas" class="lb-canvas"></div>
      </div>
    </div>

    <script src="assets/js/site-data.js"></script>
    <script src="assets/js/admin.js"></script>
    <script src="assets/js/layout-builder.js"></script>
  </body>
</html>
